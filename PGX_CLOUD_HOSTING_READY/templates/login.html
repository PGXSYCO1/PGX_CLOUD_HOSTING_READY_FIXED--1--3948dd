<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PGX CLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0a0c12] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#12141c] rounded-2xl p-8 w-full max-w-md border border-blue-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-cloud-upload-alt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">PGX <span class="text-blue-400">HOSTING</span></h1>
            <p class="text-gray-400 text-sm mt-1">Premium Hosting Solution</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <input type="hidden" name="next" value="{{ next_action|default('account') }}">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required 
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-blue-500 focus:outline-none transition">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        
        {% if google_enabled %}
        <div class="relative my-5 flex items-center"><div class="flex-1 border-t border-gray-700"></div><span class="px-3 text-xs text-gray-500">OR</span><div class="flex-1 border-t border-gray-700"></div></div>
        <a href="{{ url_for('auth_google_start', next=next_action|default('account'), server_id=server_id) if server_id else url_for('auth_google_start', next=next_action|default('account')) }}"
           class="flex w-full items-center justify-center gap-3 rounded-lg border border-gray-600 bg-white px-4 py-3 font-semibold text-gray-800 transition hover:bg-gray-100">
            <i class="fab fa-google text-red-500"></i> Continue with Google
        </a>
        {% else %}
        <p class="mt-4 text-center text-xs text-yellow-300">Google Login will be available after OAuth credentials are configured.</p>
        {% endif %}
        <div class="text-center mt-5">
            <p class="text-gray-400 text-sm">New here? <a class="text-blue-400 hover:text-blue-300 font-semibold" href="{{ url_for('register') }}">Create account</a></p>
        </div>
        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs"><i class="fas fa-shield-alt"></i> Secure Access Only</p>
        </div>
    </div>
</body>
</html>
